          {PP.length>0&&<Card><CC s={{padding:"14px 16px"}}><PG ps={PP} onU={upPl} canEdit={!isViewer} canDelete={isAdmin}/></CC></Card>}
        </div>)}
        {tab==="users"&&isAdmin&&(<div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:8}}>
            <div><span style={{fontSize:13,fontWeight:700,color:"#1e293b"}}><Ic n="users" s={15} style={{marginRight:6,verticalAlign:"-2px"}}/>Gestion des utilisateurs</span> <span style={{fontSize:11,color:"#94a3b8"}}>{users.length} compte(s) · attribue un rôle à chacun</span></div>
            <button onClick={loadUsers} style={{border:"1px solid #e2e8f0",background:"white",borderRadius:6,padding:"6px 12px",cursor:"pointer",fontSize:12,fontWeight:600}}><Ic n="refresh" s={13} style={{marginRight:5}}/>Rafraîchir</button>
          </div>
          <Card><div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead><tr><th style={{...thS,cursor:"default"}}>Email</th><th style={{...thS,cursor:"default",minWidth:260}}>Rôle</th><th style={{...thS,cursor:"default",textAlign:"right"}}>Accès</th></tr></thead>
            <tbody>{users.map(u=>{const off=u.role==="desactive";return(
              <tr key={u.id} style={{borderBottom:"1px solid #f1f5f9",opacity:off?0.6:1}}>
                <td style={{...tdS,fontSize:12,fontWeight:600}}>{u.email||u.id}</td>
                <td style={tdS}><select value={u.role} onChange={e=>setUserRole(u.id,e.target.value)} style={{padding:"6px 10px",border:"1px solid #e2e8f0",borderRadius:6,fontSize:12,fontWeight:600,background:u.role==="admin"?"#f0fdf4":u.role==="collaborateur"?"#fff7ed":off?"#f1f5f9":"#eff6ff",color:u.role==="admin"?"#166534":u.role==="collaborateur"?"#9a3412":off?"#64748b":"#1e40af"}}>
                  <option value="admin">Admin — accès total</option>
                  <option value="collaborateur">Collaborateur — ajoute & modifie</option>
                  <option value="collaborateur2">Collaborateur 2 — lecture seule</option>
                  <option value="desactive">Désactivé — aucun accès</option>
                </select></td>
                <td style={{...tdS,textAlign:"right",whiteSpace:"nowrap"}}>
                  {off&&<button onClick={()=>setUserRole(u.id,"collaborateur2")} style={{border:"1px solid #16a34a",color:"#16a34a",background:"white",borderRadius:6,padding:"5px 10px",fontSize:11,fontWeight:700,cursor:"pointer",marginRight:6}}>Réactiver</button>}
                  <button onClick={()=>deleteUser(u.id,u.email)} style={{border:"none",background:"#dc2626",color:"white",borderRadius:6,padding:"5px 12px",fontSize:11,fontWeight:700,cursor:"pointer"}}><Ic n="trash" s={12} style={{marginRight:4}}/>Supprimer</button>
                </td>
              </tr>
            );})}{!users.length&&<tr><td colSpan={3} style={{...tdS,textAlign:"center",color:"#94a3b8"}}>Aucun utilisateur</td></tr>}</tbody>
          </table></div></Card>
          <p style={{fontSize:11,color:"#94a3b8",marginTop:8}}>Le changement de rôle est immédiat et s'applique côté base (RLS). Une notification apparaît ici à chaque nouvelle inscription.</p>
        </div>)}
      </div>
      {ep&&!isViewer&&(<div className="np" style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{background:"white",borderRadius:12,padding:24,maxWidth:440,width:"90%",maxHeight:"80vh",overflow:"auto"}}>
          <h2 style={{fontSize:16,fontWeight:700,marginBottom:4}}>{ep.ld}</h2><p style={{fontSize:12,color:"#64748b",marginBottom:16}}>{ep.client}</p>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <div><label style={{fontSize:11,fontWeight:700,color:"#64748b",display:"block",marginBottom:4}}>Notes</label><input type="text" value={ep.notes||""} onChange={e=>sEp(p=>p?{...p,notes:e.target.value}:p)} style={{width:"100%",padding:"7px 10px",border:"1px solid #e2e8f0",borderRadius:6,fontSize:13}}/></div>
            <div><label style={{fontSize:11,fontWeight:700,color:"#64748b",display:"block",marginBottom:4}}>Installateur</label>
              <select value={ep.installateur||""} onChange={e=>sEp(p=>p?{...p,installateur:e.target.value,installateurLibre:e.target.value!=="Autre"?"":p.installateurLibre||""}:p)} style={{width:"100%",padding:"7px 10px",border:"1px solid #e2e8f0",borderRadius:6,fontSize:13}}><option value="">— Non renseigné</option>{INL.map(i=><option key={i} value={i}>{i}</option>)}<option value="Autre">Autre...</option></select>
              {ep.installateur==="Autre"&&<input value={ep.installateurLibre||""} placeholder="Nom..." onChange={e=>sEp(p=>p?{...p,installateurLibre:e.target.value}:p)} style={{marginTop:6,width:"100%",padding:"7px 10px",border:"1px solid #e2e8f0",borderRadius:6,fontSize:13}}/>}
            </div>
            <div><label style={{fontSize:11,fontWeight:700,color:"#64748b",display:"block",marginBottom:4}}>Réel Pose (€)</label>
              <input type="number" min={0} value={ep.reelPose||""} placeholder="Montant réel..." onChange={e=>sEp(p=>p?{...p,reelPose:parseFloat(e.target.value)||0}:p)} style={{width:"100%",padding:"7px 10px",border:"1px solid #e2e8f0",borderRadius:6,fontSize:13}}/>
              {ep.reelPose>0&&ep.previPose>0&&<div style={{marginTop:4,fontSize:11,color:ep.reelPose>ep.previPose?"#dc2626":"#16a34a",fontWeight:600}}>Prévi : {fmt(ep.previPose)} · Δ {(ep.reelPose-ep.previPose>0?"+":"")+fmt(ep.reelPose-ep.previPose)}</div>}
            </div>
            <div><label style={{fontSize:11,fontWeight:700,color:"#64748b",display:"block",marginBottom:4}}>PV reçu</label><select value={ep.pvRecu?"oui":"non"} onChange={e=>sEp(p=>p?{...p,pvRecu:e.target.value==="oui",reserves:e.target.value==="oui"?p.reserves:null}:p)} style={{width:"100%",padding:"7px 10px",border:"1px solid #e2e8f0",borderRadius:6,fontSize:13}}><option value="non">Non — En attente</option><option value="oui">Oui — PV reçu</option></select></div>
            {ep.pvRecu&&(<div><label style={{fontSize:11,fontWeight:700,color:"#64748b",display:"block",marginBottom:4}}>Réserves</label><select value={ep.reserves===true?"oui":"non"} onChange={e=>sEp(p=>p?{...p,reserves:e.target.value==="oui"}:p)} style={{width:"100%",padding:"7px 10px",border:"1px solid #e2e8f0",borderRadius:6,fontSize:13}}><option value="non">Non — Sans réserve</option><option value="oui">Oui — Avec réserves</option></select></div>)}
          </div>
          <div style={{display:"flex",gap:8,marginTop:20,justifyContent:"flex-end"}}>
            <button onClick={()=>sEp(null)} style={{padding:"8px 16px",border:"1px solid #e2e8f0",borderRadius:6,background:"white",fontSize:13,cursor:"pointer"}}>Annuler</button>
            <button onClick={()=>saveE(ep)} style={{padding:"8px 16px",background:"#2563eb",color:"white",border:"none",borderRadius:6,fontSize:13,fontWeight:600,cursor:"pointer"}}>Enregistrer</button>
          </div>
        </div>
      </div>)}
      {showPrint&&(<div className="np" style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{background:"white",borderRadius:12,padding:24,maxWidth:320,width:"90%"}}>
          <h2 style={{fontSize:15,fontWeight:700,marginBottom:8}}><Ic n="printer" s={16} style={{marginRight:6}}/>PDF — Onglet actif</h2>
          <p style={{fontSize:12,color:"#64748b",marginBottom:16}}>Boîte de dialogue → <strong>Enregistrer en PDF</strong></p>
          <div style={{display:"flex",gap:10,marginBottom:12}}>
            <button onClick={()=>doPrint(false)} style={{flex:1,padding:"14px 8px",border:"2px solid #e2e8f0",borderRadius:8,fontSize:12,fontWeight:600,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:4}}><Ic n="file" s={24}/>Portrait</button>
            <button onClick={()=>doPrint(true)} style={{flex:1,padding:"14px 8px",border:"2px solid #e2e8f0",borderRadius:8,fontSize:12,fontWeight:600,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:4}}><Ic n="file" s={24} style={{transform:"rotate(90deg)"}}/>Paysage</button>
          </div>
          <button onClick={()=>sShowPrint(false)} style={{width:"100%",padding:"9px",border:"1px solid #e2e8f0",borderRadius:8,background:"#f8fafc",fontSize:12,cursor:"pointer"}}>Annuler</button>
        </div>
      </div>)}
      {toast&&<div className="np" style={{position:"fixed",bottom:20,right:20,zIndex:300,background:"#0f2240",color:"white",padding:"12px 18px",borderRadius:8,fontSize:13,fontWeight:600,boxShadow:"0 6px 24px rgba(0,0,0,.3)",maxWidth:360}}>{toast}</div>}
    </div>
  );
}

// GATE — Login Supabase + récupération du rôle
// ═══════════════════════════════════════════════════════════════
function Login(){
  const [mode,sMode]=useState("in"); // "in" = connexion, "up" = création de compte
  const [em,sEm]=useState(""),[pw,sPw]=useState(""),[busy,sBusy]=useState(false),[err,sErr]=useState(""),[ok,sOk]=useState(""),[showPw,sShowPw]=useState(false),[logoOk,sLogoOk]=useState(true);
  const isUp=mode==="up";
  const submit=async e=>{e.preventDefault();sErr("");sOk("");sBusy(true);
    if(isUp){
      if(pw.length<6){sErr("Mot de passe : 6 caractères minimum");sBusy(false);return;}
      const{data,error}=await supa.auth.signUp({email:em,password:pw});
      if(error)sErr(error.message==="User already registered"?"Ce compte existe déjà":error.message);
      else if(!data.session){const{error:e2}=await supa.auth.signInWithPassword({email:em,password:pw});if(e2)sErr("Compte créé. Connecte-toi avec tes identifiants.");}
    }else{
      const{error}=await supa.auth.signInWithPassword({email:em,password:pw});
      if(error)sErr("Identifiants incorrects");
    }
    sBusy(false);
  };
  const toggle=()=>{sMode(isUp?"in":"up");sErr("");sOk("");};
  return <div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#7f1d1d 0%,#1c1917 60%,#0c0a09 100%)"}}>
    <form onSubmit={submit} style={{background:"white",borderRadius:12,padding:32,width:340,boxShadow:"0 14px 50px rgba(0,0,0,.45)",borderTop:"4px solid #dc2626"}}>
      <div style={{textAlign:"center",marginBottom:20}}>
        {logoOk?
          <img src={LOGO} alt="Vertical" style={{height:52,maxWidth:220,objectFit:"contain",marginBottom:4}}/>
          :
          <div style={{fontWeight:900,fontSize:24,letterSpacing:4,color:"#dc2626"}}>VERTICAL</div>
        }
        <div style={{fontSize:11,color:"#94a3b8",marginTop:4}}>{isUp?"Créer un compte":"Dashboard Opérationnel"}</div>
      </div>
      <input type="email" placeholder="Email" value={em} onChange={e=>sEm(e.target.value)} required style={{width:"100%",padding:"10px 12px",border:"1px solid #e2e8f0",borderRadius:8,fontSize:14,marginBottom:10}}/>
      <div style={{position:"relative",marginBottom:14}}>
        <input type={showPw?"text":"password"} placeholder={isUp?"Mot de passe (6 car. min.)":"Mot de passe"} value={pw} onChange={e=>sPw(e.target.value)} required style={{width:"100%",padding:"10px 42px 10px 12px",border:"1px solid #e2e8f0",borderRadius:8,fontSize:14}}/>
        <button type="button" onClick={()=>sShowPw(v=>!v)} title={showPw?"Masquer":"Afficher"} style={{position:"absolute",right:6,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",padding:6,color:"#64748b",display:"flex"}}>
          {showPw?
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            :
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          }
        </button>
      </div>
      {err&&<div style={{background:"#fee2e2",color:"#991b1b",padding:"8px 12px",borderRadius:6,fontSize:12,marginBottom:12,fontWeight:600}}>{err}</div>}
      {ok&&<div style={{background:"#dcfce7",color:"#14532d",padding:"8px 12px",borderRadius:6,fontSize:12,marginBottom:12,fontWeight:600}}>{ok}</div>}
      <button type="submit" disabled={busy} style={{width:"100%",padding:"11px",background:isUp?"#16a34a":"#dc2626",color:"white",border:"none",borderRadius:8,fontSize:14,fontWeight:700,cursor:"pointer",opacity:busy?0.6:1}}>{busy?"Veuillez patienter...":(isUp?"Créer mon compte":"Se connecter")}</button>
      <div style={{textAlign:"center",marginTop:16,fontSize:13,color:"#64748b"}}>
        {isUp?"Déjà un compte ? ":"Pas encore de compte ? "}
        <span onClick={toggle} style={{color:"#dc2626",fontWeight:700,cursor:"pointer",textDecoration:"underline"}}>{isUp?"Se connecter":"Créer un compte"}</span>
      </div>
    </form>
  </div>;
}
function Root(){
  const [session,sSession]=useState(undefined);
  const [role,sRole]=useState(null);
  useEffect(()=>{if(!supa)return;
    supa.auth.getSession().then(({data})=>sSession(data.session||null));
    const{data:sub}=supa.auth.onAuthStateChange((_e,s)=>sSession(s||null));
    return()=>sub.subscription.unsubscribe();
  },[]);
  useEffect(()=>{if(!session){sRole(null);return;}(async()=>{
    const{data}=await supa.from("profiles").select("role").eq("id",session.user.id).single();
    sRole(data?.role||"collaborateur2"); // défaut le plus restreint si le profil est absent
  })();},[session]);
  if(!supa)return <div style={{padding:40}}>Supabase non configuré.</div>;
  if(session===undefined)return <div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"#64748b"}}>Chargement…</div>;
  if(!session)return <Login/>;
  if(role===null)return <div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"#64748b"}}>Vérification du rôle…</div>;
  if(role==="desactive")return <div style={{height:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,background:"#0f2240",color:"white",textAlign:"center",padding:24}}><div style={{marginBottom:2,display:"flex"}}><Ic n="lock" s={40} c="#94a3b8"/></div><div style={{fontSize:18,fontWeight:700}}>Accès désactivé</div><div style={{fontSize:13,color:"#94a3b8",maxWidth:360}}>Votre compte n'a plus accès à ce dashboard. Contactez un administrateur si vous pensez qu'il s'agit d'une erreur.</div><button onClick={()=>supa.auth.signOut()} style={{marginTop:8,background:"#dc2626",color:"white",border:"none",padding:"9px 18px",borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer"}}>Se déconnecter</button></div>;
  return <App role={role} userEmail={session.user.email} onLogout={()=>supa.auth.signOut()}/>;
}
try{ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);}catch(e){showErr("Erreur React: "+e.message+"\n"+e.stack);}
</script>
