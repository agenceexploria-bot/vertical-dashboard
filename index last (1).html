function Card({children,s,np}){return <div className={np?"np":""} style={{background:"white",border:"1px solid #e2e8f0",borderRadius:8,boxShadow:"0 1px 3px rgba(0,0,0,.06)",...s}}>{children}</div>;}

}

const OBJ_M=[200000,200000,300000,300000,100000,380000,380000,380000,380000,380000,380000,420000],OBJ_T=OBJ_M.reduce((a,b)=>a+b,0);
const FMS=["Jan","Fév","Mars","Avr","Mai","Juin","Juil","Août","Sept","Oct","Nov","Déc"];
const CD={"ANNEMASSE":"74","AIX-EN-PROVENCE":"13","AARTSELAAR":"BE","AURILLAC":"15","BEAUNE":"21","BEAUVAIS":"60","BLAGNAC":"31","CHAMBRAY-LES-TOURS":"37","CHATEAUBOURG":"35","CHENE BOURG":"CH","CLICHY":"92","COLOMIERS":"31","CROISSY-BEAUBOURG":"77","DOURDAN":"91","DREUX":"28","FLEAC":"16","GLAND":"CH","GRASSE":"06","HAUTERIVE":"CH","HOERDT":"67","HOUILLES":"78","INGRE":"45","LA COURONNE":"16","LESQUIN":"59","LISBOA":"PT","MASSY":"91","MONTPELLIER":"34","PARIS":"75","PERTUIS":"84","PLUGUFFAN":"29","SAINT-ETIENNE-DU-GRES":"13","SAINT-JUST-SAINT-RAMBERT":"42","SAINT-LOUBES":"33","SAINT-QUENTIN":"02","SAINT-QUENTIN-FALLAVIER":"38","SAINT-THIBAULT-DES-VIGNES":"77","SAINT-WITZ":"95","STRASBOURG":"67","TASSIN-LA-DEMI-LUNE":"69","VARILHES":"09","VILLEFRANCHE":"12","CHAVANOD":"74"};
const glLd=ld=>ld.replace(/-\d+$/,""),isCh=ld=>/-\d+$/.test(ld);
const MN={"jan":0,"fév":1,"fev":1,"mar":2,"avr":3,"mai":4,"juin":5,"juil":6,"aoû":7,"aou":7,"sept":8,"sep":8,"oct":9,"nov":10,"déc":11,"dec":11};
const pM=m=>{if(!m)return null;const p=m.toLowerCase().replace(/\./g,"").trim().split(/\s+/);if(p.length<2)return null;const mo=MN[p[0]]??MN[p[0].substring(0,3)];if(mo===undefined)return null;const y=parseInt(p[1].length===2?("20"+p[1]):p[1]);return isNaN(y)?null:new Date(y,mo,1);};

function nH(h){return h.replace(/"/g,"").trim().toLowerCase().replace(/\s+/g,"_").replace(/[éèêë]/g,"e").replace(/[àâä]/g,"a").replace(/[ùûü]/g,"u").replace(/[îï]/g,"i").replace(/[ôö]/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9_]/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,"");}
function parseCSV(t){const r=Papa.parse(t,{header:true,skipEmptyLines:"greedy"});if(!r.data||!r.data.length)return[];return r.data.map(row=>{const nr={};Object.keys(row).forEach(k=>{nr[nH(k)]=String(row[k]||"").trim();});const ld=nr["lead_number"]||"";if(!ld.startsWith("LD"))return null;const rd=nr["date_mise_en_service"]||"",dm=rd.split(" ")[0].split("T")[0];const vi=nr["ville"]||"",dept=nr["delivery_address_departement_code_du_departement"]||nr["dept"]||CD[vi.toUpperCase()]||"";
const stg=(nr["etape"]||nr["pipeline_stages"]||"").toLowerCase();

return{ld,client:nr["nom_de_la_societe"]||"",ville:vi,dept,ca:parseFloat((nr["total_ht"]||"0").replace(/[^0-9.]/g,""))||0,dateMES:dm.length>=8?dm:"",previPose:parseFloat((nr["dont_pose"]||"0").replace(/[^0-9.]/g,""))||0,solde};}).filter(Boolean);}
function SB({pv,rv}){if(!pv)return <span style={{background:"#fef3c7",color:"#92400e",padding:"2px 8px",borderRadius:12,fontSize:11,fontWeight:700}}>En attente</span>;if(rv===true)return <span style={{background:"#fee2e2",color:"#991b1b",padding:"2px 8px",borderRadius:12,fontSize:11,fontWeight:700}}>⚠ Réserves</span>;return <span style={{background:"#dcfce7",color:"#14532d",padding:"2px 8px",borderRadius:12,fontSize:11,fontWeight:700}}>✓ Sans réserve</span>;}
const iP=()=>{try{const s=localStorage.getItem("vp");if(s)return JSON.parse(s);}catch(e){}return[];};
const iO=()=>{try{const s=localStorage.getItem("vo");if(s)return JSON.parse(s);}catch(e){}return[];};

const PH=[
  {n:1,lb:"Admin.",fl:"Formalités administratives",co:"#f97316",et:[{k:"formalites_admin",lb:"Formalités admin."}]},
  {n:2,lb:"Études",fl:"Études",co:"#3b82f6",et:[{k:"etudes",lb:"Études"}]},
  {n:3,lb:"Fabrication",fl:"Fabrication",co:"#e11d48",et:[{k:"fabrication",lb:"Fabrication"}]},
  {n:4,lb:"Transport",fl:"Transport",co:"#0891b2",et:[{k:"transport",lb:"Transport"}]},
  {n:5,lb:"Install.",fl:"Installation",co:"#0d9488",et:[{k:"installation",lb:"Installation"}]},
  {n:6,lb:"MES",fl:"Mise en service",co:"#16a34a",et:[{k:"mise_en_service",lb:"Mise en service"},{k:"reception_finale",lb:"Réception client"}]},
];
const AE=PH.flatMap(p=>p.et.map(e=>({...e,ph:p})));
const pD=s=>{if(!s)return null;const d=new Date(s+"T00:00:00");return isNaN(d.getTime())?null:d;};
const iWk=d=>{const t=new Date(d.valueOf());t.setDate(t.getDate()+4-(t.getDay()||7));const y=new Date(t.getFullYear(),0,1);return Math.ceil((((t-y)/86400000)+1)/7);};
const mnd=d=>{const r=new Date(d);r.setHours(0,0,0,0);r.setDate(r.getDate()-((r.getDay()+6)%7));return r;};
const gCE=p=>{for(const e of AE){const d=p.dates[e.k];if(!d||!d.done)return e.k;}return null;};
const isLt=p=>{const t=new Date();t.setHours(0,0,0,0);for(const e of AE){const d=p.dates[e.k];if(!d||d.done)continue;const f=pD(d.fin);if(f&&f<t)return true;}return false;};
const WW=50,RH=44;
const bWk=ps=>{let mn=null,mx=null;ps.forEach(p=>AE.forEach(e=>{const d=p.dates[e.k];if(!d)return;const db=pD(d.debut),fn=pD(d.fin);if(db&&(!mn||db<mn))mn=db;if(fn&&(!mx||fn>mx))mx=fn;}));const n=new Date();const s=mnd(new Date((mn||new Date(n.getFullYear(),n.getMonth()-1,1)).getTime()-7*86400000));const en=new Date((mx||new Date(n.getFullYear(),n.getMonth()+5,1)).getTime()+21*86400000);const w=[];const c=new Date(s);while(c<=en){w.push(new Date(c));c.setDate(c.getDate()+7);}return w;};
const mGrp=wk=>{const g=[];wk.forEach(w=>{const lb=w.toLocaleDateString("fr-FR",{month:"short",year:"2-digit"});const l=g[g.length-1];if(l&&l.lb===lb)l.ct++;else g.push({lb,yr:w.getFullYear(),mo:w.getMonth(),ct:1});});return g;};
const dX=(wk,d)=>{for(let i=0;i<wk.length;i++){const nx=new Date(wk[i]);nx.setDate(nx.getDate()+7);if(d>=wk[i]&&d<nx)return i*WW+((d.getDay()+6)%7)/7*WW;}return wk.length>0&&d<wk[0]?0:wk.length*WW;};

// ── PDF planning par projet ──────────────────────────────────
function planPDF(p){
  const pw=window.open('','_blank');
  if(!pw){alert('Autorisez les popups pour imprimer');return;}
  const fmtE=new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0});
  const today=new Date();
  let mn=null,mx=null;
  AE.forEach(e=>{const d=p.dates[e.k];if(!d)return;const db=pD(d.debut),fn=pD(d.fin);if(db&&(!mn||db<mn))mn=db;if(fn&&(!mx||fn>mx))mx=fn;});
  const gs=new Date(mn||new Date(today.getFullYear(),today.getMonth(),1));gs.setDate(1);
  const ge=new Date(mx||new Date(today.getFullYear(),today.getMonth()+6,1));ge.setMonth(ge.getMonth()+1,1);
  const tot=ge-gs,pct=d=>Math.max(0,Math.min(100,(d-gs)/tot*100));
  const mos=[];const mc=new Date(gs.getFullYear(),gs.getMonth(),1);
  while(mc<ge){const nl=new Date(mc.getFullYear(),mc.getMonth()+1,1);mos.push({l:mc.toLocaleDateString("fr-FR",{month:"short",year:"2-digit"}),lp:pct(mc),wp:pct(nl)-pct(mc)});mc.setMonth(mc.getMonth()+1);}
  const bars=AE.map(et=>{const d=p.dates[et.k];const db=d?.debut?pD(d.debut):null;const fn=d?.fin?pD(d.fin):null;const bar=db&&fn?`<div style="position:absolute;left:${pct(db)}%;width:${Math.max(0.5,pct(new Date(fn.getTime()+86400000))-pct(db))}%;top:6px;height:14px;background:${et.ph.co};opacity:${d.done?1:0.65};border-radius:3px"></div>`:'';return `<div style="height:26px;position:relative;border-bottom:1px solid #f1f5f9">${bar}</div>`;}).join('');
  const rows=AE.map((et,i)=>{const d=p.dates[et.k];const db=d?.debut?pD(d.debut):null;const fn=d?.fin?pD(d.fin):null;const has=d?.debut||d?.fin;return `<tr style="background:${i%2===0?'white':'#fafafa'}"><td style="padding:4px 8px;border:1px solid #e2e8f0"><span style="display:inline-block;width:7px;height:7px;border-radius:1px;background:${et.ph.co};margin-right:5px;vertical-align:middle"></span><strong>Étape ${et.ph.n}</strong> · ${et.lb}</td><td style="padding:4px 8px;border:1px solid #e2e8f0;color:${has?'#374151':'#9ca3af'}">${d?.debut||'—'}</td><td style="padding:4px 8px;border:1px solid #e2e8f0;color:${has?'#374151':'#9ca3af'}">${d?.fin||'—'}</td><td style="padding:4px 8px;border:1px solid #e2e8f0;text-align:center;font-weight:600;color:#6b7280">${db?'S'+iWk(db):'—'}</td><td style="padding:4px 8px;border:1px solid #e2e8f0;text-align:center;font-weight:600;color:#6b7280">${fn?'S'+iWk(fn):'—'}</td><td style="padding:4px 8px;border:1px solid #e2e8f0;text-align:center;color:${d?.done?'#16a34a':'#f97316'};font-weight:600">${d?.done?'✓ Réalisé':has?'Planifié':'—'}</td></tr>`;}).join('');
  const css=`*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}body{font-family:system-ui,sans-serif;padding:0}@page{size:A4 landscape;margin:10mm 12mm}`;
  pw.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>${css}</style></head><body style="padding:14px 16px;font-size:11px">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;padding-bottom:10px;border-bottom:3px solid #dc2626">
    <div>
      <div style="font-size:10px;font-weight:700;color:#dc2626;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">▐ Vertical Montecharge — Planning prévisionnel</div>
      <div style="font-size:18px;font-weight:700;color:#1e293b;margin-bottom:5px">${p.nom}</div>
      <div style="display:flex;gap:16px;font-size:11px;color:#6b7280;flex-wrap:wrap">
        <span><strong style="color:#374151">Client :</strong> ${p.client}</span>
        <span><strong style="color:#374151">Réf. :</strong> ${p.id}</span>
        <span style="color:#dc2626"><strong>Montant HT :</strong> <strong>${fmtE.format(p.montant)}</strong></span>
      </div>
    </div>
    <div style="text-align:right;font-size:10px;color:#9ca3af">
      <div style="font-weight:600;color:#374151;margin-bottom:2px">Document confidentiel</div>
      <div>Édité le ${today.toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"})}</div>
    </div>
  </div>
  <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#374151;margin-bottom:6px">Planning par phases</div>
  <div style="border:1px solid #e2e8f0;border-radius:6px;overflow:hidden;margin-bottom:14px">
    <div style="display:flex">
      <div style="width:145px;flex-shrink:0;border-right:1px solid #e2e8f0">
        <div style="height:20px;background:#f8fafc;border-bottom:2px solid #cbd5e1"></div>
        ${AE.map(et=>`<div style="height:26px;display:flex;align-items:center;padding:0 8px;gap:5px;border-bottom:1px solid #f1f5f9"><div style="width:8px;height:8px;border-radius:1px;flex-shrink:0;background:${et.ph.co}"></div><span style="font-size:9px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#374151">${et.ph.n}. ${et.ph.lb}</span>${(p.dates[et.k]?.done?'<span style="font-size:9px;color:#16a34a;margin-left:auto">✓</span>':'')}</div>`).join('')}
      </div>
      <div style="flex:1;position:relative;overflow:hidden">
        <div style="position:relative;height:20px;background:#f8fafc;border-bottom:2px solid #cbd5e1">
          ${mos.map(m=>`<div style="position:absolute;left:${m.lp}%;width:${m.wp}%;top:0;bottom:0;display:flex;align-items:center;padding-left:5px;border-right:1px solid #cbd5e1;font-size:9px;font-weight:700;color:#374151;overflow:hidden">${m.l}</div>`).join('')}
        </div>
        ${bars}
      </div>
    </div>
  </div>
  <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#374151;margin-bottom:6px">Détail des jalons</div>
  <table style="width:100%;border-collapse:collapse;font-size:10px">
    <thead><tr style="background:#f8fafc">
      <th style="padding:5px 8px;text-align:left;border:1px solid #e2e8f0;font-weight:700;color:#374151">Étape</th>

      <th style="padding:5px 8px;text-align:left;border:1px solid #e2e8f0;font-weight:700;color:#374151">Date fin prévue</th>
      <th style="padding:5px 8px;text-align:center;border:1px solid #e2e8f0;font-weight:700;color:#374151">Sem. début</th>
      <th style="padding:5px 8px;text-align:center;border:1px solid #e2e8f0;font-weight:700;color:#374151">Sem. fin</th>
      <th style="padding:5px 8px;text-align:center;border:1px solid #e2e8f0;font-weight:700;color:#374151">Statut</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>
  <div style="display:flex;justify-content:space-between;font-size:8px;color:#94a3b8;padding-top:6px;border-top:1px solid #e2e8f0;margin-top:10px">
    <span>Vertical Montecharge — Document confidentiel réservé au destinataire</span>
    <span>Généré le ${today.toLocaleDateString("fr-FR")}</span>

  </body></html>`);
  pw.document.close();pw.focus();setTimeout(()=>{pw.print();pw.close();},700);

// ── Panneau d'édition d'un projet ───────────────────────────
function PE({p,onS,onC,onD}){
  const [f,sF]=useState(JSON.parse(JSON.stringify(p)));
  const sd=(k,fld,v)=>sF(x=>({...x,dates:{...x.dates,[k]:{...(x.dates[k]||{debut:"",fin:"",done:false}),[fld]:v}}}));
  return <div style={{borderTop:"3px solid #f97316",background:"#fffaf9",padding:"12px 14px"}}>
    <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginBottom:10,padding:"8px 10px",background:"white",borderRadius:7,border:"1px solid #e5e7eb"}}>
      <input value={f.nom} onChange={e=>sF(x=>({...x,nom:e.target.value}))} placeholder="Nom du projet" style={{flex:"2 1 140px",fontSize:12,fontWeight:600,border:"1px solid #d1d5db",borderRadius:5,padding:"4px 8px"}}/>
      <input value={f.client} onChange={e=>sF(x=>({...x,client:e.target.value}))} placeholder="Client" style={{flex:"1 1 100px",fontSize:12,border:"1px solid #d1d5db",borderRadius:5,padding:"4px 8px"}}/>
      <input type="number" value={f.montant} onChange={e=>sF(x=>({...x,montant:parseFloat(e.target.value)||0}))} placeholder="Montant €" style={{width:100,fontSize:12,border:"1px solid #d1d5db",borderRadius:5,padding:"4px 8px"}}/>
      <div style={{display:"flex",gap:5,marginLeft:"auto"}}>

                  {op&&(<div style={{border:"1px solid #e2e8f0",borderTop:"none",borderRadius:"0 0 8px 8px",overflowX:"auto"}}>
                    <table style={{width:"100%",borderCollapse:"collapse"}}>
                      <thead><tr><th style={thS}>N° LD</th><th style={thS}>Client</th><th style={thS}>Mois</th><th style={{...thS,textAlign:"center",background:"#eff6ff",minWidth:70}}>On Time</th><th style={{...thS,textAlign:"center",background:"#eff6ff",minWidth:80}}>Sans Rés.</th><th style={{...thS,background:"#f0fdf4",minWidth:130}}>Fournisseur</th><th style={{...thS,textAlign:"center",background:"#f0fdf4",minWidth:45}}>OT</th><th style={{...thS,textAlign:"center",background:"#f0fdf4",minWidth:45}}>IF</th><th style={{...thS,textAlign:"center",background:"#f0fdf4",minWidth:45}}>IQ</th><th style={thS}>Bilan</th><th style={{...thS,minWidth:150}}>Notes</th></tr></thead>
                      <tbody>{es.map(o=>{
                        const gok=o.onTime===true&&o.sansReserves===true,hf=!!(o.fournisseur||o.fournisseurLibre),fok=!hf||(o.fournOT===true&&o.fournIF===true&&o.fournIQ===true);
                        const chk=(v,f)=><input type="checkbox" checked={v===true} onChange={e=>upO(o.ld,f,e.target.checked)} style={{width:15,height:15,cursor:"pointer",accentColor:"#2563eb"}}/>;
                        return(
                          <tr key={o.ld} style={{borderBottom:"1px solid #f1f5f9",background:(gok&&fok)?"#f0fdf4":"#fff5f5"}}>
                            <td style={{...tdS,fontWeight:700,color:"#2563eb",whiteSpace:"nowrap"}}>{o.ld}</td>
                            <td style={{...tdS,maxWidth:130,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontSize:11}} title={o.client}>{o.client||"—"}</td>
                            <td style={{...tdS,color:"#64748b",fontSize:11}}>{o.mois}</td>
                            <td style={{...tdS,textAlign:"center"}}>{chk(o.onTime,"onTime")}</td><td style={{...tdS,textAlign:"center"}}>{chk(o.sansReserves,"sansReserves")}</td>
                            <td style={{...tdS,padding:"4px 8px"}}><select value={o.fournisseur||""} onChange={e=>upO(o.ld,"fournisseur",e.target.value)} style={{padding:"2px 4px",border:"1px solid #e2e8f0",borderRadius:4,fontSize:11,width:"100%"}}><option value="">—</option>{FNL.map(f=><option key={f} value={f}>{f}</option>)}<option value="Autre">Autre...</option></select>{o.fournisseur==="Autre"&&<input value={o.fournisseurLibre||""} onChange={e=>upO(o.ld,"fournisseurLibre",e.target.value)} placeholder="Fournisseur..." style={{marginTop:2,padding:"2px 4px",border:"1px solid #e2e8f0",borderRadius:4,fontSize:11,width:"100%"}}/>}</td>
                            <td style={{...tdS,textAlign:"center"}}>{hf?chk(o.fournOT,"fournOT"):<span style={{color:"#e2e8f0"}}>—</span>}</td><td style={{...tdS,textAlign:"center"}}>{hf?chk(o.fournIF,"fournIF"):<span style={{color:"#e2e8f0"}}>—</span>}</td><td style={{...tdS,textAlign:"center"}}>{hf?chk(o.fournIQ,"fournIQ"):<span style={{color:"#e2e8f0"}}>—</span>}</td>
                            <td style={tdS}>{(gok&&fok)?<span style={{background:"#dcfce7",color:"#14532d",padding:"2px 6px",borderRadius:10,fontSize:10,fontWeight:700}}>✓ OK</span>:<span style={{background:"#fee2e2",color:"#991b1b",padding:"2px 6px",borderRadius:10,fontSize:10,fontWeight:700}}>⚠ Non OK</span>}</td>
                            <td style={{...tdS,padding:"4px 8px"}}><input value={o.notes||""} onChange={e=>upO(o.ld,"notes",e.target.value)} placeholder="Notes..." style={{padding:"2px 6px",border:"1px solid transparent",borderRadius:4,fontSize:11,width:"100%",background:"transparent"}} onFocus={e=>e.target.style.borderColor="#e2e8f0"} onBlur={e=>e.target.style.borderColor="transparent"}/></td>
                          </tr>
                        );
                      })}</tbody>
                    </table>
                  </div>)}
                </div>
              );
            })}
          </div>}
        </div>)}

        {tab==="prev"&&(<div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:16}}>
            {[{l:"CA pipeline FY",v:fmt(totF),s:"Obj. FY : "+fmt(OBJ_T),c:"#2563eb"},{l:"Facturé réel FY (Soldé)",v:fmt(totR),s:Math.round(totR/OBJ_T*100)+"% de l'objectif",c:totR>=OBJ_T?"#16a34a":"#2563eb"},{l:"Réceptions ce mois",v:(fd.find(m=>m.mois===cML)||{nb:0}).nb,s:cML,c:"#7c3aed"},{l:"CA prévu ce mois",v:fmt((fd.find(m=>m.mois===cML)||{ca:0}).ca),s:"obj. "+fmt((fd.find(m=>m.mois===cML)||{objectif:0}).objectif),c:"#7c3aed"}].map(k=>(
              <Card key={k.l}><CC s={{padding:16}}>
                <div style={{fontSize:11,color:"#64748b",fontWeight:700,textTransform:"uppercase",marginBottom:6}}>{k.l}</div>
                <div style={{fontSize:22,fontWeight:800,color:k.c}}>{k.v}</div>
                <div style={{fontSize:11,color:"#94a3b8",marginTop:4}}>{k.s}</div>
              </CC></Card>
            ))}
          </div>
          <Card s={{marginBottom:16}}>
            <CH><CT>CA mensuel — Pipeline (Gagné) vs Facturé réel (Soldé) vs Objectifs — FY 2026/2027</CT></CH>
            <CC><ChartBox key={PS.length} ck={PS.length} h={270} cfg={prevCfg}/></CC>
          </Card>
          <Card>
            <CH><CT>Détail par mois</CT></CH>
            <CC s={{padding:0}}>
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead><tr><th style={thS}>Mois</th><th style={thS}>Nb</th><th style={{...thS,color:"#15803d"}}>Soldé (réel)</th><th style={{...thS,color:"#2563eb"}}>Gagné (pipeline)</th><th style={thS}>Objectif</th><th style={thS}>Écart réel</th><th style={{...thS,color:"#15803d"}}>Cumulé réel</th><th style={thS}>Obj. cumulé</th><th style={thS}>Affaires</th></tr></thead>
                <tbody>
                  {fd.map(m=>(<tr key={m.mois} style={{borderBottom:"1px solid #f1f5f9",background:m.mois===cML?"#eff6ff":"white"}}>
                    <td style={{...tdS,fontWeight:700}}>{m.mois}{m.mois===cML&&<span style={{marginLeft:6,background:"#dbeafe",color:"#1d4ed8",padding:"1px 6px",borderRadius:10,fontSize:10}}>EN COURS</span>}</td>
                    <td style={tdS}><span style={{background:"#f1f5f9",padding:"2px 8px",borderRadius:12,fontWeight:700}}>{m.nb}</span></td>
                    <td style={{...tdS,fontWeight:700,color:m.caR>0?"#15803d":"#94a3b8"}}>{m.caR>0?fmt(m.caR):"—"}</td>
                    <td style={{...tdS,fontWeight:600,color:m.caP>0?"#2563eb":"#94a3b8"}}>{m.caP>0?fmt(m.caP):"—"}</td>
                    <td style={{...tdS,color:"#64748b"}}>{fmt(m.objectif)}</td>
                    <td style={{...tdS,fontWeight:600,color:m.caR>=m.objectif?"#16a34a":m.caR>0?"#dc2626":"#94a3b8"}}>{m.caR>0?((m.caR-m.objectif>=0?"+":"")+fmt(m.caR-m.objectif)):"—"}</td>
                    <td style={{...tdS,fontWeight:700,color:"#15803d"}}>{m.cumulR>0?fmt(m.cumulR):"—"}</td>
                    <td style={{...tdS,color:"#64748b"}}>{fmt(m.objCumul)}</td>
                    <td style={tdS}><div style={{display:"flex",flexWrap:"wrap",gap:4}}>{m.pr.map(ld=><span key={ld} title={(PS.find(p=>p.ld===ld)||{client:""}).client} style={{background:"#eff6ff",color:"#1d4ed8",padding:"1px 6px",borderRadius:4,fontSize:10,fontWeight:600,cursor:"help"}}>{ld}</span>)}{!m.pr.length&&<span style={{color:"#94a3b8",fontSize:11}}>—</span>}</div></td>
                  </tr>))}
                  <tr style={{background:"#f8fafc",borderTop:"2px solid #e2e8f0"}}><td style={{...tdS,fontWeight:700}}>TOTAL FY</td><td style={tdS}><span style={{background:"#e2e8f0",padding:"2px 8px",borderRadius:12,fontWeight:700}}>{PS.length}</span></td><td style={{...tdS,fontWeight:700,color:"#15803d"}}>{totR>0?fmt(totR):"—"}</td><td style={{...tdS,fontWeight:700,color:"#2563eb"}}>{fmt(totF-totR)}</td><td style={{...tdS,fontWeight:700}}>{fmt(OBJ_T)}</td><td style={{...tdS,fontWeight:700,color:totR>=OBJ_T?"#16a34a":"#dc2626"}}>{totR>0?((totR-OBJ_T>=0?"+":"")+fmt(totR-OBJ_T)):"—"}</td><td style={{...tdS,fontWeight:700,color:"#15803d"}}>{totR>0?fmt(totR):"—"}</td><td style={{...tdS,fontWeight:700}}>{fmt(OBJ_T)}</td><td style={tdS}/></tr>
                </tbody>
              </table>
            </CC>
          </Card>
        </div>)}
        {tab==="planning"&&(<div>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginBottom:12}}>
            <span style={{fontSize:13,fontWeight:700,color:"#1e293b"}}>🗓️ Planning Gantt</span>
            <span style={{fontSize:11,color:"#94a3b8"}}>{PP.length} projet(s)</span>
            <div style={{flex:1}}/>
            <button onClick={()=>sPAdd(v=>!v)} style={{background:pAdd?"#6b7280":"#f97316",color:"white",border:"none",padding:"5px 12px",borderRadius:6,fontSize:11,fontWeight:600,cursor:"pointer"}}>{pAdd?"✕ Annuler":"+ Nouveau projet"}</button>
          </div>
          {pAdd&&(<div style={{background:"white",border:"1px solid #e5e7eb",borderRadius:8,padding:"12px 14px",marginBottom:12}}>
            <div style={{fontSize:12,fontWeight:700,marginBottom:8,color:"#374151"}}>Nouveau projet</div>
            <div style={{display:"grid",gap:8,gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))"}}>
              {[{k:"nom",l:"Nom *"},{k:"client",l:"Client"},{k:"id",l:"Référence"},{k:"montant",l:"Montant HT €",t:"number"}].map(f=>(
                <div key={f.k}><div style={{fontSize:11,color:"#64748b",marginBottom:2}}>{f.l}</div>
                <input type={f.t||"text"} value={pNew[f.k]} onChange={e=>sPNew(p=>({...p,[f.k]:e.target.value}))} style={{width:"100%",border:"1px solid #e2e8f0",borderRadius:5,padding:"5px 8px",fontSize:12}}/></div>
              ))}
            </div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:10}}>
              <button onClick={()=>sPAdd(false)} style={{padding:"6px 14px",border:"1px solid #e2e8f0",borderRadius:6,background:"white",fontSize:12,cursor:"pointer"}}>Annuler</button>
              <button onClick={()=>{if(!pNew.nom)return;sPP(prev=>[...prev,{id:pNew.id||`VM-${new Date().getFullYear()}-${String(prev.length+1).padStart(3,"0")}`,nom:pNew.nom,client:pNew.client,montant:parseFloat(pNew.montant)||0,dates:{}}]);sPNew({id:"",nom:"",client:"",montant:""});sPAdd(false);}} style={{padding:"6px 14px",background:"#f97316",color:"white",border:"none",borderRadius:6,fontSize:12,fontWeight:600,cursor:"pointer"}}>Créer</button>
            </div>
          </div>)}
          {PP.length===0&&!pAdd&&(<div style={{textAlign:"center",padding:"60px 20px",color:"#94a3b8",background:"white",borderRadius:8,border:"1px solid #e2e8f0"}}><div style={{fontSize:48,marginBottom:12}}>🗓️</div><div style={{fontSize:16,fontWeight:700,color:"#64748b",marginBottom:8}}>Aucun projet</div><div style={{fontSize:13}}>Importez votre CSV Odoo ou créez un projet manuellement</div></div>)}
          {PP.length>0&&<Card><CC s={{padding:"14px 16px"}}><PG ps={PP} onU={upPl}/></CC></Card>}
        </div>)}
      </div>

      {ep&&(<div className="np" style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{background:"white",borderRadius:12,padding:24,maxWidth:440,width:"90%",maxHeight:"80vh",overflow:"auto"}}>
          <h2 style={{fontSize:16,fontWeight:700,marginBottom:4}}>{ep.ld}</h2><p style={{fontSize:12,color:"#64748b",marginBottom:16}}>{ep.client}</p>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <div><label style={{fontSize:11,fontWeight:700,color:"#64748b",display:"block",marginBottom:4}}>Notes</label><input type="text" value={ep.notes||""} onChange={e=>sEp(p=>p?{...p,notes:e.target.value}:p)} style={{width:"100%",padding:"7px 10px",border:"1px solid #e2e8f0",borderRadius:6,fontSize:13}}/></div>
            <div><label style={{fontSize:11,fontWeight:700,color:"#64748b",display:"block",marginBottom:4}}>Installateur</label>
              <select value={ep.installateur||""} onChange={e=>sEp(p=>p?{...p,installateur:e.target.value,installateurLibre:e.target.value!=="Autre"?"":p.installateurLibre||""}:p)} style={{width:"100%",padding:"7px 10px",border:"1px solid #e2e8f0",borderRadius:6,fontSize:13}}><option value="">— Non renseigné</option>{INL.map(i=><option key={i} value={i}>{i}</option>)}<option value="Autre">Autre...</option></select>
              {ep.installateur==="Autre"&&<input value={ep.installateurLibre||""} placeholder="Nom..." onChange={e=>sEp(p=>p?{...p,installateurLibre:e.target.value}:p)} style={{marginTop:6,width:"100%",padding:"7px 10px",border:"1px solid #e2e8f0",borderRadius:6,fontSize:13}}/>}
            </div>
            <div><label style={{fontSize:11,fontWeight:700,color:"#64748b",display:"block",marginBottom:4}}>Réel Pose (€)</label>
              <input type="number" min={0} value={ep.reelPose||""} placeholder="Montant réel..." onChange={e=>sEp(p=>p?{...p,reelPose:parseFloat(e.target.value)||0}:p)} style={{width:"100%",padding:"7px 10px",border:"1px solid #e2e8f0",borderRadius:6,fontSize:13}}/>
              {ep.reelPose>0&&ep.previPose>0&&<div style={{marginTop:4,fontSize:11,color:ep.reelPose>ep.previPose?"#dc2626":"#16a34a",fontWeight:600}}>Prévi : {fmt(ep.previPose)} · Δ {(ep.reelPose-ep.previPose>0?"+":"")+fmt(ep.reelPose-ep.previPose)}</div>}
            </div>
            <div><label style={{fontSize:11,fontWeight:700,color:"#64748b",display:"block",marginBottom:4}}>PV reçu</label><select value={ep.pvRecu?"oui":"non"} onChange={e=>sEp(p=>p?{...p,pvRecu:e.target.value==="oui",reserves:e.target.value==="oui"?p.reserves:null}:p)} style={{width:"100%",padding:"7px 10px",border:"1px solid #e2e8f0",borderRadius:6,fontSize:13}}><option value="non">Non — En attente</option><option value="oui">Oui — PV reçu</option></select></div>
            {ep.pvRecu&&(<div><label style={{fontSize:11,fontWeight:700,color:"#64748b",display:"block",marginBottom:4}}>Réserves</label><select value={ep.reserves===true?"oui":"non"} onChange={e=>sEp(p=>p?{...p,reserves:e.target.value==="oui"}:p)} style={{width:"100%",padding:"7px 10px",border:"1px solid #e2e8f0",borderRadius:6,fontSize:13}}><option value="non">Non — Sans réserve ✓</option><option value="oui">Oui — Avec réserves ⚠</option></select></div>)}
          </div>
          <div style={{display:"flex",gap:8,marginTop:20,justifyContent:"flex-end"}}>
            <button onClick={()=>sEp(null)} style={{padding:"8px 16px",border:"1px solid #e2e8f0",borderRadius:6,background:"white",fontSize:13,cursor:"pointer"}}>Annuler</button>
            <button onClick={()=>saveE(ep)} style={{padding:"8px 16px",background:"#2563eb",color:"white",border:"none",borderRadius:6,fontSize:13,fontWeight:600,cursor:"pointer"}}>Enregistrer</button>
          </div>
        </div>
      </div>)}

      {showPrint&&(<div className="np" style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{background:"white",borderRadius:12,padding:24,maxWidth:320,width:"90%"}}>
          <h2 style={{fontSize:15,fontWeight:700,marginBottom:8}}>🖨️ PDF — Onglet actif</h2>
          <p style={{fontSize:12,color:"#64748b",marginBottom:16}}>Boîte de dialogue → <strong>Enregistrer en PDF</strong></p>
          <div style={{display:"flex",gap:10,marginBottom:12}}>
            <button onClick={()=>doPrint(false)} style={{flex:1,padding:"14px 8px",border:"2px solid #e2e8f0",borderRadius:8,fontSize:12,fontWeight:600,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:4}}><span style={{fontSize:24}}>📄</span>Portrait</button>
            <button onClick={()=>doPrint(true)} style={{flex:1,padding:"14px 8px",border:"2px solid #e2e8f0",borderRadius:8,fontSize:12,fontWeight:600,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:4}}><span style={{fontSize:24,display:"inline-block",transform:"rotate(90deg)"}}>📄</span>Paysage</button>
          </div>
          <button onClick={()=>sShowPrint(false)} style={{width:"100%",padding:"9px",border:"1px solid #e2e8f0",borderRadius:8,background:"#f8fafc",fontSize:12,cursor:"pointer"}}>Annuler</button>
        </div>
      </div>)}
    </div>
  );
}
try{ReactDOM.createRoot(document.getElementById("root")).render(<App/>);}catch(e){showErr("Erreur React: "+e.message+"\n"+e.stack);}
</script>
</body>
</html>
